[project]
name = "raven-docs-tools"
version = "0.1.0"
description = "Host-side toolchain for the 32Raven handbook (MkDocs Material)."
requires-python = ">=3.10"
# Deliberately empty, and this file covers ONLY the docs site. Every first-party
# *script* declares its own dependencies inline via PEP 723 and is invoked with
# `uv run --script` (see stm32/CMakeLists.txt and the Makefile) — a script is
# self-describing, so duplicating its deps here would just be a second place to
# forget to update. The handbook is not a script, so it needs a group.
dependencies = []

[tool.uv]
managed = true
package = false          # nothing to build; this is an env spec, not a library

# Opt-in docs toolchain. NOT a default group — install with `uv sync --group docs`
# (or just run `make docs`, which resolves it on demand). Keeping it opt-in means
# a contributor who only builds firmware never pulls MkDocs.
[dependency-groups]
docs = [
    "mkdocs-material>=9.5",      # mkdocs core + Material theme
    "pymdown-extensions>=10.7",  # superfences / snippets / details / tabbed
]

# Scripts under tools/ pull their third-party imports from their own PEP 723
# header, so those packages are never in this env and the editor cannot resolve
# them. Silencing it here rather than per-import keeps the source clean, and
# scoping it to tools/ leaves a genuinely missing import elsewhere reportable.
[[tool.pyright.executionEnvironments]]
root = "tools"
reportMissingImports = "none"

[[tool.pyright.executionEnvironments]]
root = "."
