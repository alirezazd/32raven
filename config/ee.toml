# `slot` fixes each record's place in the EEPROM. Records are packed in slot
# order, so a new one takes the next slot and nothing already stored moves.

[stm32.imu.accel_calibration]
type_name = "ImuAccelCalibration"
tag = "IAC1"
slot = 0

[[stm32.imu.accel_calibration.fields]]
name = "offsets"
type = "float"
count = 3

[[stm32.imu.accel_calibration.fields]]
name = "gains"
type = "float"
count = 3

[stm32.rc.calibration]
type_name = "RcCalibration"
tag = "RCC1"
slot = 1

[[stm32.rc.calibration.fields]]
name = "min_us"
type = "uint16_t"
count = 16

[[stm32.rc.calibration.fields]]
name = "max_us"
type = "uint16_t"
count = 16

[[stm32.rc.calibration.fields]]
name = "trim_us"
type = "uint16_t"
count = 16

[[stm32.rc.calibration.fields]]
name = "rev"
type = "int8_t"
count = 16

[stm32.rc.map]
type_name = "RcMap"
tag = "RCM1"
slot = 2

[[stm32.rc.map.fields]]
name = "roll_channel"
type = "uint8_t"

[[stm32.rc.map.fields]]
name = "pitch_channel"
type = "uint8_t"

[[stm32.rc.map.fields]]
name = "yaw_channel"
type = "uint8_t"

[[stm32.rc.map.fields]]
name = "throttle_channel"
type = "uint8_t"

[stm32.imu.gyro_calibration]
type_name = "ImuGyroCalibration"
tag = "IGC1"
slot = 3

[[stm32.imu.gyro_calibration.fields]]
name = "offsets_rad_s"
type = "float"
count = 3

[[stm32.imu.gyro_calibration.fields]]
name = "calibrated"
type = "uint8_t"

[stm32.mag.calibration]
type_name = "MagnetometerCalibration"
tag = "MGC1"
slot = 4

[[stm32.mag.calibration.fields]]
name = "offsets_ut"
type = "float"
count = 3

[[stm32.mag.calibration.fields]]
name = "diag"
type = "float"
count = 3

[[stm32.mag.calibration.fields]]
name = "offdiag"
type = "float"
count = 3

[[stm32.mag.calibration.fields]]
name = "calibrated"
type = "uint8_t"
