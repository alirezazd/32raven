# A record is found by its tag, not by a place in the image: at boot the
# stored image is walked header by header, a record this firmware no longer
# knows is dropped and the rest are packed. Adding one is adding it here;
# removing one is deleting it here.

[stm32.imu.accel_calibration]
type_name = "ImuAccelCalibration"
tag = "IAC1"

[[stm32.imu.accel_calibration.fields]]
name = "offsets"
type = "float"
count = 3

[[stm32.imu.accel_calibration.fields]]
name = "gains"
type = "float"
count = 3

[stm32.rc.map]
type_name = "RcMap"
tag = "RCM1"

[[stm32.rc.map.fields]]
name = "roll_channel"
type = "uint8_t"

[[stm32.rc.map.fields]]
name = "pitch_channel"
type = "uint8_t"

[[stm32.rc.map.fields]]
name = "yaw_channel"
type = "uint8_t"

[[stm32.rc.map.fields]]
name = "throttle_channel"
type = "uint8_t"

[stm32.imu.gyro_calibration]
type_name = "ImuGyroCalibration"
tag = "IGC1"

[[stm32.imu.gyro_calibration.fields]]
name = "offsets_rad_s"
type = "float"
count = 3

[[stm32.imu.gyro_calibration.fields]]
name = "calibrated"
type = "uint8_t"

[stm32.mag.calibration]
type_name = "MagnetometerCalibration"
tag = "MGC1"

[[stm32.mag.calibration.fields]]
name = "offsets_ut"
type = "float"
count = 3

[[stm32.mag.calibration.fields]]
name = "diag"
type = "float"
count = 3

[[stm32.mag.calibration.fields]]
name = "offdiag"
type = "float"
count = 3

[[stm32.mag.calibration.fields]]
name = "calibrated"
type = "uint8_t"

[stm32.board.trim]
type_name = "BoardTrim"
tag = "BTR1"

[[stm32.board.trim.fields]]
name = "roll_deg"
type = "float"

[[stm32.board.trim.fields]]
name = "pitch_deg"
type = "float"

[[stm32.board.trim.fields]]
name = "yaw_deg"
type = "float"
