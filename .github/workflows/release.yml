# A release is a claim the firmware makes about itself: a build cut from a
# release tag reports MAVLink's OFFICIAL version type, and a ground station
# checks OFFICIAL builds against the releases published here. So the tag, the
# version the generator derives, and the release name all have to agree, and
# this workflow refuses to publish when they do not.
name: release

on:
  push:
    tags:
      # Both the plain form and suffixed prereleases; which is which is
      # decided below, from the tag rather than from who pushed it.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  # The same build every push already goes through, including its linters:
  # a tag is not a reason to publish something that was never checked.
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Whole history, for the same reason the esp32 build job needs it: the
      # version is derived from it, and this job has to derive the same one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v9.0.0

      # The gate. A tag naming a version the tree does not produce would ship
      # binaries that report something else, and the mismatch would only ever
      # be found from a vehicle in the field.
      - name: Tag agrees with the generated version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(uv run --quiet --script \
            scripts/generate_firmware_ver.py --ref HEAD)"

          case "$tag" in
            *-*)
              prerelease=true
              ;;
            *)
              prerelease=false

              if [ "$tag" != "v$version" ]; then
                echo "::error::tag $tag names a version the tree does not" \
                     "produce (v$version)" >&2
                exit 1
              fi

              release_build="$(uv run --quiet --script \
                scripts/generate_firmware_ver.py --release-build)"
              if [ "$release_build" != true ]; then
                echo "::error::$tag does not point at HEAD, so the firmware" \
                     "would report itself as a development build" >&2
                exit 1
              fi
              ;;
          esac

          printf 'prerelease=%s\n' "$prerelease" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Firmware
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp artifacts/firmware-stm32/32Raven_stm32.bin dist/
          cp artifacts/firmware-esp32/32Raven_esp32.bin dist/
          ( cd dist && sha256sum ./* > SHA256SUMS )
          ls -l dist

      # The images are for reference and checking: `make flash-all` builds the
      # same tag and writes a blank bridge whole, which the images alone cannot.
      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'MD'
          ## Flashing

          From a checkout of this tag, `make flash-all` builds both boards and
          writes them over USB, a blank bridge included. Once the bridge runs
          32Raven, `make flash-wifi-all` does the same over its Wi-Fi.

          | asset | what it is |
          | --- | --- |
          | `32Raven_stm32.bin` | flight computer firmware |
          | `32Raven_esp32.bin` | bridge firmware |
          | `SHA256SUMS` | checksums for both |
          MD

          # Anchored on the release this one replaces, since that release and
          # its tag are gone by the time anything reads the notes -- so the
          # changelog link is pinned to the commit the tag named.
          previous="$(gh release list --exclude-drafts --limit 1 \
            --json tagName --jq '.[0].tagName // empty')"
          args=(-f tag_name="$GITHUB_REF_NAME")
          if [ -n "$previous" ]; then
            args+=(-f previous_tag_name="$previous")
          fi
          printf '\n' >> notes.md
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            "${args[@]}" --jq .body >> notes.md
          if [ -n "$previous" ]; then
            previous_commit="$(git rev-parse "$previous^{commit}")"
            sed -i "s|/compare/$previous\.\.\.|/compare/$previous_commit...|" \
              notes.md
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # Titled explicitly: without it the release is published nameless
          # rather than falling back to the tag.
          args=(--title "$GITHUB_REF_NAME" --notes-file notes.md)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" dist/*

      # One release at a time, and one release tag: the newest is the only
      # one a ground station is checked against, and a board flashed from an
      # older one should be reflashed rather than found.
      - name: Retire the previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --json tagName \
            --jq '.[] | select(.tagName != env.GITHUB_REF_NAME) | .tagName' \
            | xargs -r -n1 gh release delete --yes --cleanup-tag
