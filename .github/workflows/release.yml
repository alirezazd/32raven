# A release is a claim the firmware makes about itself: a build cut from a
# release tag reports MAVLink's OFFICIAL version type, and a ground station
# checks OFFICIAL builds against the releases published here. So the tag, the
# version the generator derives, and the release name all have to agree, and
# this workflow refuses to publish when they do not.
name: release

on:
  push:
    tags:
      # Both the plain form and suffixed prereleases; which is which is
      # decided below, from the tag rather than from who pushed it.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  # The same build every push already goes through, including its linters:
  # a tag is not a reason to publish something that was never checked.
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Whole history, for the same reason the esp32 build job needs it: the
      # version is derived from it, and this job has to derive the same one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v9.0.0

      # The gate. A tag naming a version the tree does not produce would ship
      # binaries that report something else, and the mismatch would only ever
      # be found from a vehicle in the field.
      - name: Tag agrees with the generated version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(uv run --quiet --script \
            scripts/generate_firmware_ver.py --ref HEAD)"

          case "$tag" in
            *-*)
              prerelease=true
              ;;
            *)
              prerelease=false

              if [ "$tag" != "v$version" ]; then
                echo "::error::tag $tag names a version the tree does not" \
                     "produce (v$version)" >&2
                exit 1
              fi

              release_build="$(uv run --quiet --script \
                scripts/generate_firmware_ver.py --release-build)"
              if [ "$release_build" != true ]; then
                echo "::error::$tag does not point at HEAD, so the firmware" \
                     "would report itself as a development build" >&2
                exit 1
              fi
              ;;
          esac

          printf 'prerelease=%s\n' "$prerelease" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Firmware
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      # upload-artifact keeps the paths below the common ancestor, so the
      # ESP32's two support images arrive in subdirectories. Flattened here
      # because a release asset list has no directories, and prefixed because
      # `bootloader.bin` in a flat list does not say whose it is.
      - name: Stage release assets
        run: |
          mkdir -p dist
          cp artifacts/firmware-stm32/32Raven_stm32.bin dist/
          cp artifacts/firmware-stm32/32Raven_stm32.elf dist/
          cp artifacts/firmware-esp32/32Raven_esp32.bin dist/
          cp artifacts/firmware-esp32/ota_data_initial.bin \
            dist/esp32-ota_data_initial.bin
          cp artifacts/firmware-esp32/bootloader/bootloader.bin \
            dist/esp32-bootloader.bin
          cp artifacts/firmware-esp32/partition_table/partition-table.bin \
            dist/esp32-partition-table.bin

          # The configuration is what this firmware is, and it is not
          # recoverable from the binaries. Shipped so a release can be rebuilt.
          cp config/32raven.config dist/32raven.config

          ( cd dist && sha256sum ./* > SHA256SUMS )
          ls -l dist

      # Offsets read from the build rather than written here: a partition
      # table that moves would otherwise leave the instructions pointing at
      # the old address, and nothing would notice until a board was bricked.
      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > notes.md
          import json
          import pathlib

          args = json.loads(
              pathlib.Path(
                  "artifacts/firmware-esp32/flasher_args.json"
              ).read_text()
          )
          asset = {
              "bootloader/bootloader.bin": "esp32-bootloader.bin",
              "partition_table/partition-table.bin":
                  "esp32-partition-table.bin",
              "ota_data_initial.bin": "esp32-ota_data_initial.bin",
              "32Raven_esp32.bin": "32Raven_esp32.bin",
          }
          settings = args["flash_settings"]
          chip = args["extra_esptool_args"]["chip"]

          print("## Flashing")
          print()
          print("The flight computer, over the bridge:")
          print()
          print("```")
          print("make flash-wifi-stm32   # or make flash-stm32 over USB")
          print("```")
          print()
          print(f"The bridge, onto a blank {chip} part:")
          print()
          print("```")
          print(f"esptool.py --chip {chip} write_flash \\")
          print(
              f"  --flash_mode {settings['flash_mode']}"
              f" --flash_size {settings['flash_size']}"
              f" --flash_freq {settings['flash_freq']} \\"
          )
          rows = sorted(args["flash_files"].items(), key=lambda kv: int(kv[0], 16))
          # No trailing continuation on the last row, or the block pastes
          # into a shell that then sits waiting for more.
          joined = " ".join(
              f"{offset} {asset[path]}" for offset, path in rows
          )
          print(f"  {joined}")
          print("```")
          print()
          print("| asset | what it is |")
          print("| --- | --- |")
          print("| `32Raven_stm32.bin` | flight computer firmware |")
          print("| `32Raven_stm32.elf` | the same build with symbols, for reading a panic traceback |")
          print("| `32Raven_esp32.bin` | bridge firmware, and the only image an over-the-air update needs |")
          print("| `esp32-bootloader.bin` | second-stage bootloader, only for a blank part |")
          print("| `esp32-partition-table.bin` | partition table, only for a blank part |")
          print("| `esp32-ota_data_initial.bin` | selects the slot a blank part boots from |")
          print("| `32raven.config` | the Kconfig selections these binaries were built from |")
          print("| `SHA256SUMS` | checksums for everything above |")
          PY

          # Anchored on the release this one replaces, since that release and
          # its tag are gone by the time anything reads the notes -- so the
          # changelog link is pinned to the commit the tag named.
          previous="$(gh release list --exclude-drafts --limit 1 \
            --json tagName --jq '.[0].tagName // empty')"
          args=(-f tag_name="$GITHUB_REF_NAME")
          if [ -n "$previous" ]; then
            args+=(-f previous_tag_name="$previous")
          fi
          printf '\n' >> notes.md
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            "${args[@]}" --jq .body >> notes.md
          if [ -n "$previous" ]; then
            previous_commit="$(git rev-parse "$previous^{commit}")"
            sed -i "s|/compare/$previous\.\.\.|/compare/$previous_commit...|" \
              notes.md
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # Titled explicitly: without it the release is published nameless
          # rather than falling back to the tag.
          args=(--title "$GITHUB_REF_NAME" --notes-file notes.md)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" dist/*

      # One release at a time, and one release tag: the newest is the only
      # one a ground station is checked against, and a board flashed from an
      # older one should be reflashed rather than found.
      - name: Retire the previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --json tagName \
            --jq '.[] | select(.tagName != env.GITHUB_REF_NAME) | .tagName' \
            | xargs -r -n1 gh release delete --yes --cleanup-tag
