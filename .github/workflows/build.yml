# The linters never compile anything, so a CMakeLists that names a file which
# is not in the tree passes every gate and still fails a clean clone.
#
# USE_DOCKER=0: the runner is already the environment the Dockerfile builds.
name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  stm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keyed on the gitlinks rather than .gitmodules: the URLs never move,
      # the pinned commits do, and a stale tree restored under a moved pin
      # would build the wrong Eigen.
      - name: Submodule pins
        id: pins
        run: |
          echo "key=$(git ls-tree HEAD third_party/ | sha256sum | cut -c1-16)" \
            >> "$GITHUB_OUTPUT"

      # The pinned Eigen commit is not its branch tip, so the shallow fetch
      # below has to follow up with a direct fetch of that one commit -- the
      # request GitLab sheds first under load, and it has taken two pushes down.
      # Cached, a busy GitLab only costs a run when the pin actually moves.
      # `.git/modules` comes too: without the submodule git dirs the working
      # trees below are not checkouts, and the step would refetch them anyway.
      - name: Cache submodules
        uses: actions/cache@v6
        with:
          path: |
            third_party/eigen
            third_party/nanoprintf
            third_party/stm32_open_pin_data
            .git/modules
          key: submodules-${{ steps.pins.outputs.key }}

      # Recursive would fetch ESP-IDF and its own submodules for a build that
      # never reads them. A no-op on a cache hit.
      - name: Submodules
        run: |
          git submodule update --init --depth 1 \
            third_party/eigen third_party/nanoprintf \
            third_party/stm32_open_pin_data

      - uses: astral-sh/setup-uv@v9.0.0

      # The doctor has to fail on a bare runner, or it is a no-op that would
      # keep passing as its tables rot. This is the assertion that gives the
      # green one below its meaning.
      - name: Doctor fails before the toolchain is installed
        run: |
          if make doctor TARGET=stm32; then
            echo "::error::doctor passed on a runner with no ARM toolchain" >&2
            exit 1
          fi

      # The installer owns the package list, so this job cannot drift from it:
      # a wrong table stops being a stale comment and becomes a failed build.
      # clang-tidy comes with it because the checks below need this job's build.
      - name: Toolchain
        run: make install-deps TARGET=stm32 YES=1

      - name: Doctor
        run: make doctor TARGET=stm32

      # `make doctor` claims this floor is what CI proves. Nothing else pins the
      # version ubuntu-latest happens to ship, so assert it here rather than let
      # the constant drift above the toolchain it describes.
      - name: ARM toolchain meets the doctor's floor
        run: |
          floor=$(sed -n 's/^ARM_GCC_MIN_MAJOR = \([0-9]*\).*/\1/p' \
            scripts/check_setup.py)
          have=$(arm-none-eabi-g++ -dumpversion | cut -d. -f1)
          echo "arm-none-eabi-g++ $have, doctor floor $floor"
          test "$have" -ge "$floor"

      - name: Build
        run: make stm32 USE_DOCKER=0

      - name: Size
        run: arm-none-eabi-size build/Ninja/stm32/32Raven_stm32.elf

      # These three read the compilation database this build just produced, and
      # skip when there is none -- which is every run outside a build job, so
      # this is the only place they are enforced. Each job sees only its own
      # build directory, so each firmware needs its own copy of them.
      - name: Unassigned config fields
        run: uv run --quiet --script scripts/lint/check_config_coverage.py

      - name: Unused includes
        run: uv run --quiet --script scripts/lint/check_unused_includes.py

      - name: clang-tidy
        run: uv run --quiet --script scripts/lint/check_tidy.py

      # The Kconfig generators run during the build. A diff here means the
      # committed headers disagree with the config they came from.
      - name: Generated files match the tree
        run: git diff --exit-code -- . ':(exclude)third_party'

  esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Cache ESP-IDF tools
        uses: actions/cache@v6
        with:
          path: ~/.espressif
          key: espressif-${{ hashFiles('third_party/esp-idf/version.txt') }}

      # Same ownership as the stm32 job: the installer's table is the list, so
      # it cannot drift from what the build needs. It runs first because
      # idf-install builds its Python env against these.
      - name: Toolchain
        run: make install-deps TARGET=esp32 YES=1

      - name: Install ESP-IDF tools
        run: make idf-install USE_DOCKER=0

      # No bare-runner counterpart to the stm32 job's failure assertion: the
      # cache step above can restore ~/.espressif, so a red doctor would not be
      # guaranteed and the check would flake.
      - name: Doctor
        run: make doctor TARGET=esp32

      - name: Build
        run: make esp32 USE_DOCKER=0

      # The ESP32 half of the same three. See the stm32 job for why they cannot
      # run anywhere but a build.
      - name: Unassigned config fields
        run: uv run --quiet --script scripts/lint/check_config_coverage.py

      - name: Unused includes
        run: uv run --quiet --script scripts/lint/check_unused_includes.py

      - name: clang-tidy
        run: uv run --quiet --script scripts/lint/check_tidy.py

      - name: Generated files match the tree
        run: git diff --exit-code -- . ':(exclude)third_party'
