# The backstop for the pre-commit hooks, which are skippable with --no-verify
# and absent from a fresh clone. Runs the same scripts with no arguments, so
# they walk `git ls-files` and cover what a commit happened not to touch.
name: lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The message check walks every commit, not the worktree.
          fetch-depth: 0

      # The config checks run the generators, and STM32 pin validation reads
      # the vendored ST pin database. Only that one: the rest of third_party is
      # C++ this job never compiles.
      - name: Submodules
        run: git submodule update --init --depth 1 third_party/stm32_open_pin_data

      - uses: astral-sh/setup-uv@v9.0.0

      # Every checker discovers its own files through git, so the checkout must
      # be a real repository, not an export.
      - name: Licence headers
        run: uv run --quiet --script scripts/lint/check_license.py

      - name: Comment shape
        run: uv run --quiet --script scripts/lint/check_comments.py

      - name: Roadmap references in TODO markers
        run: uv run --quiet --script scripts/lint/check_todos.py

      - name: Python lint (ruff)
        run: uvx ruff@0.16.3 check .

      - name: Unused error enumerators
        run: uv run --quiet --script scripts/lint/check_error_codes.py

      - name: Forbidden constructs
        run: uv run --quiet --script scripts/lint/check_forbidden.py

      - name: Direct timer access
        run: uv run --quiet --script scripts/lint/check_timer_access.py

      - name: Singleton GetInstance placement
        run: uv run --quiet --script scripts/lint/check_singleton_style.py

      - name: GPIO alternate-function indices
        run: uv run --quiet --script scripts/lint/check_gpio_af.py

      # The config checks below need no compiler: they run the generators
      # against config/Kconfig and render the templates in memory. The ones
      # that do need a build live in build.yml instead.
      - name: Stale Kconfig symbols
        run: uv run --quiet --script scripts/lint/check_config_staleness.py

      - name: Kconfig hygiene
        run: uv run --quiet --script scripts/lint/check_config_hygiene.py

      - name: Unread template context keys
        run: uv run --quiet --script scripts/lint/check_context_keys.py

      # A minute of sweeping, which is why it is here and not in a commit hook.
      - name: Kconfig knobs that change nothing
        run: uv run --quiet --script scripts/lint/check_config_sweep.py

      - name: Hook coverage
        run: uv run --quiet --script scripts/lint/check_hook_coverage.py

      # Whole history rather than the pushed range: a range has edge cases
      # (first push, force push, a `before` that no longer exists) and each one
      # is a way for a bad message to arrive unchecked. Scanning everything has
      # none, and also fails a force-push that puts an old one back.
      - name: Commit message shape
        run: uv run --quiet --script scripts/lint/check_commit_msg.py --range HEAD
