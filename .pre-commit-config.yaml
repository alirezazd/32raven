# Hygiene runs here rather than in CMake: none of it changes a byte of firmware,
# and a build gate that fails on a dead enum interrupts whatever you were
# actually debugging. The checks that do decide whether the artifact is correct
# -- forbidden constructs, the pin map -- stay in the build.
#
# Hooks receive the staged paths, so a commit costs one pass over what it
# touched. CI runs the same scripts with no arguments, where they walk
# `git ls-files` and cover what a commit happened not to touch.
# The commit-msg hook only runs once `pre-commit install` has created it, so
# the hook types are declared here rather than left to whoever cloned last.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Vendored and generated files are excluded from both: upstream's
      # whitespace is upstream's business, and a generator or menuconfig would
      # just re-dirty what we fixed. The Search Console token is served back
      # byte-for-byte, so a newline appended to it fails verification.
      - id: end-of-file-fixer
        exclude: &not_ours '^(third_party/.*|stm32/lib/CMSIS_F4xx/.*|stm32/Core/(system_)?stm32f4xx.*|docs/google[0-9a-f]+\.html|config/32raven\.config|.*_(config|limits)\.hpp)$'
      - id: trailing-whitespace
        # Source only. In a .patch or a fixture, trailing space is content.
        files: '\.(c|h|cpp|hpp|py|j2|md|ya?ml)$'
        exclude: *not_ours

  - repo: local
    hooks:
      # Version pinned to match `make lint-py` and lint.yml.
      - id: ruff
        name: Python lint (ruff)
        entry: uvx ruff@0.16.3 check --force-exclude
        language: system
        types: [python]

      - id: check-license
        name: SPDX and copyright headers
        entry: uv run --quiet --script scripts/lint/check_license.py
        language: system
        pass_filenames: false
        files: '\.(c|h|cpp|hpp|py|sh|j2|ya?ml)$'

      - id: check-comments
        name: Comment shape
        entry: uv run --quiet --script scripts/lint/check_comments.py
        language: system
        files: '\.(c|h|cpp|hpp)$'

      # Whole-tree: a marker resolves against docs/roadmap.md, so deleting a
      # delivered item is what strands one -- in a file the commit never
      # touched.
      - id: check-todos
        name: Roadmap references in TODO markers
        entry: uv run --quiet --script scripts/lint/check_todos.py
        language: system
        pass_filenames: false
        files: '\.(c|h|cpp|hpp|py|md|cmake|sh)$'

      - id: check-commit-msg
        name: Commit message shape
        entry: uv run --quiet --script scripts/lint/check_commit_msg.py
        language: system
        stages: [commit-msg]

      - id: check-error-codes
        name: Unused error enumerators
        entry: uv run --quiet --script scripts/lint/check_error_codes.py
        language: system
        pass_filenames: false
        files: '\.(c|h|cpp|hpp)$'

      - id: check-timer-access
        name: Direct timer access
        entry: uv run --quiet --script scripts/lint/check_timer_access.py
        language: system
        files: '\.(c|h|cpp|hpp)$'

      - id: check-singleton-style
        name: Singleton shape
        entry: uv run --quiet --script scripts/lint/check_singleton_style.py
        language: system
        files: '\.(h|hpp)$'

      - id: check-gpio-af
        name: GPIO alternate-function indices
        entry: uv run --quiet --script scripts/lint/check_gpio_af.py
        language: system
        pass_filenames: false
        files: '^stm32/Drivers/gpio\.hpp$'

      # Needs a compilation database and clang-tidy, so it skips rather than
      # fails when either is missing -- see the script's docstring.
      - id: check-unused-includes
        name: Unused includes
        entry: uv run --quiet --script scripts/lint/check_unused_includes.py
        language: system
        files: '\.(c|cpp)$'

      # The clang-tidy checks that find defects rather than style. Shares the
      # compilation-database plumbing above, so it skips on the same terms.
      - id: check-tidy
        name: clang-tidy
        entry: uv run --quiet --script scripts/lint/check_tidy.py
        language: system
        files: '\.(c|cpp)$'

      # Runs the generators to see which symbols they actually read, so it has
      # to re-check everything whenever either side of the pair moves. The
      # hygiene hook shares that trigger: both read the whole Kconfig, so
      # neither can be scoped to the staged paths.
      - id: check-config-staleness
        name: Stale Kconfig symbols
        entry: uv run --quiet --script scripts/lint/check_config_staleness.py
        language: system
        pass_filenames: false
        files: &config_surface '^(config/(Kconfig|32raven\.config)|scripts/(kconfig_gen|generate_.*)\.py|scripts/templates/.*\.j2)$'

      - id: check-config-hygiene
        name: Kconfig hygiene
        entry: uv run --quiet --script scripts/lint/check_config_hygiene.py
        language: system
        pass_filenames: false
        files: *config_surface

      # Reads the hook list it is part of, so it cannot be scoped to the staged
      # paths either: a workflow losing a step is what it exists to notice.
      - id: check-hook-coverage
        name: Hook coverage
        entry: uv run --quiet --script scripts/lint/check_hook_coverage.py
        language: system
        pass_filenames: false
        files: '^(\.pre-commit-config\.yaml|\.github/workflows/.*\.yml|scripts/lint/.*)$'

      # Wider trigger than the two above: this one renders every template, so
      # the EEPROM layout is part of its input and a field added there is a
      # context key that may reach no template.
      - id: check-context-keys
        name: Unread template context keys
        entry: uv run --quiet --script scripts/lint/check_context_keys.py
        language: system
        pass_filenames: false
        files: '^(config/(Kconfig|32raven\.config|ee\.toml)|scripts/(kconfig_gen|generate_.*)\.py|scripts/templates/.*\.j2)$'

      # Needs a compilation database and the cross toolchain's own headers, so
      # like check-unused-includes it skips rather than fails when the tree has
      # not been built. Driver headers matter too: a field added there is
      # exactly what goes unassigned.
      - id: check-config-coverage
        name: Unassigned config fields
        entry: uv run --quiet --script scripts/lint/check_config_coverage.py
        language: system
        pass_filenames: false
        files: '^(scripts/templates/.*\.j2|scripts/generate_.*\.py|(esp32|stm32)/.*\.hpp)$'

      # A generated header that calls into the firmware, or reads its
      # constants, is carrying a check that belongs with the code it names.
      - id: check-config-reach
        name: Generated config reaching into the firmware
        entry: uv run --quiet --script scripts/lint/check_config_reach.py
        language: system
        pass_filenames: false
        files: '^(scripts/templates/.*\.j2|scripts/generate_.*\.py)$'
